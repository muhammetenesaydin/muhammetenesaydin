<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Muhammet Enes Aydin - AI and Autonomous Systems">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c192c"/>
    </linearGradient>

    <radialGradient id="glowCenter" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="4" y="4" width="1192" height="242" rx="18"/>
    </clipPath>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; r: 4.5; }
        50% { opacity: 0.35; r: 3.2; }
      }
      @keyframes sweep {
        0% { transform: translateX(-420px); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateX(1220px); opacity: 0.2; }
      }
      @keyframes waveShift {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      .dot { animation: pulseDot 2.2s ease-in-out infinite; }
      .scanner { animation: sweep 5.5s ease-in-out infinite; }
      .wave { animation: waveShift 4s ease-in-out infinite; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="4" y="4" width="1192" height="242" fill="url(#bgGrad)"/>
    <rect x="4" y="4" width="1192" height="242" fill="url(#grid)"/>
    <rect x="4" y="4" width="1192" height="242" fill="url(#glowCenter)"/>

    <path class="wave" d="M 0 210 Q 300 175 600 205 T 1200 190" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35"/>
    <path class="wave" d="M 0 225 Q 350 198 700 220 T 1200 208" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

    <rect class="scanner" x="0" y="4" width="380" height="2.5" fill="url(#scanLine)"/>

    <path d="M 24 38 L 24 22 L 40 22" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.6"/>
    <path d="M 1160 22 L 1176 22 L 1176 38" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.6"/>
    <path d="M 24 212 L 24 228 L 40 228" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.6"/>
    <path d="M 1160 228 L 1176 228 L 1176 212" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.6"/>
  </g>

  <rect x="4" y="4" width="1192" height="242" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <g transform="translate(600, 44)">
    <rect x="-188" y="-13" width="376" height="26" rx="13" fill="#0b1324" stroke="#1e3a5f" stroke-width="1"/>
    <circle class="dot" cx="-168" cy="0" r="4.5" fill="#38bdf8"/>
    <text class="mono" x="8" y="4" text-anchor="middle" fill="#93c5fd" font-size="11.5" letter-spacing="1.8" font-weight="600">AUTONOMOUS SYSTEMS · AI · ROBOTICS</text>
  </g>

  <text class="sans" x="600" y="108" text-anchor="middle" fill="url(#titleGrad)" font-size="44" font-weight="800" letter-spacing="1.2">Muhammet Enes Aydın</text>

  <text class="sans" x="600" y="143" text-anchor="middle" fill="#94a3b8" font-size="16.5" font-weight="500" letter-spacing="0.4">AI &amp; Autonomous Systems  ·  Computer Vision  ·  Embedded Hardware  ·  Protocol Security</text>

  <g transform="translate(600, 188)">
    <g transform="translate(-340, 0)">
      <rect x="-108" y="-15" width="216" height="30" rx="15" fill="#0f213a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.65"/>
      <text class="mono" x="0" y="4" text-anchor="middle" fill="#e0f2fe" font-size="12" font-weight="600">ROS 2 · Gazebo · ArduPilot</text>
    </g>
    <g transform="translate(-110, 0)">
      <rect x="-98" y="-15" width="196" height="30" rx="15" fill="#0f213a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.65"/>
      <text class="mono" x="0" y="4" text-anchor="middle" fill="#e0f2fe" font-size="12" font-weight="600">TensorRT · 120–150 FPS</text>
    </g>
    <g transform="translate(110, 0)">
      <rect x="-98" y="-15" width="196" height="30" rx="15" fill="#0f213a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.65"/>
      <text class="mono" x="0" y="4" text-anchor="middle" fill="#e0f2fe" font-size="12" font-weight="600">Teknofest Competitor</text>
    </g>
    <g transform="translate(335, 0)">
      <rect x="-100" y="-15" width="200" height="30" rx="15" fill="#0f213a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.65"/>
      <text class="mono" x="0" y="4" text-anchor="middle" fill="#e0f2fe" font-size="12" font-weight="600">CAN / OCPP Security</text>
    </g>
  </g>
</svg>

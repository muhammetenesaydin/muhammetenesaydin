<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Muhammet Enes Aydın">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c192c"/>
    </linearGradient>

    <radialGradient id="glowCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="4" y="4" width="1192" height="152" rx="18"/>
    </clipPath>

    <style>
      @keyframes sweep {
        0% { transform: translateX(-420px); opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { transform: translateX(1220px); opacity: 0.2; }
      }
      @keyframes waveShift {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.65; }
      }
      .scanner { animation: sweep 5.5s ease-in-out infinite; }
      .wave { animation: waveShift 4s ease-in-out infinite; }
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="4" y="4" width="1192" height="152" fill="url(#bgGrad)"/>
    <rect x="4" y="4" width="1192" height="152" fill="url(#grid)"/>
    <rect x="4" y="4" width="1192" height="152" fill="url(#glowCenter)"/>

    <path class="wave" d="M 0 132 Q 300 104 600 128 T 1200 116" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.35"/>
    <path class="wave" d="M 0 144 Q 350 122 700 140 T 1200 130" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25"/>

    <rect class="scanner" x="0" y="4" width="380" height="2.5" fill="url(#scanLine)"/>

    <path d="M 24 38 L 24 22 L 40 22" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.6"/>
    <path d="M 1160 22 L 1176 22 L 1176 38" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.6"/>
    <path d="M 24 122 L 24 138 L 40 138" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.6"/>
    <path d="M 1160 138 L 1176 138 L 1176 122" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.6"/>
  </g>

  <rect x="4" y="4" width="1192" height="152" rx="18" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text class="sans" x="600" y="96" text-anchor="middle" fill="url(#titleGrad)" font-size="52" font-weight="800" letter-spacing="1.4">Muhammet Enes Aydın</text>
</svg>
